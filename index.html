<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff9f43">
  <title>食材管理アプリ Local</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="app-title">食材管理</div>
        <div class="version" id="versionLabel"></div>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="設定">⚙️</button>
    </header>

    <section id="mainView" class="view active">
      <section class="card input-card">
        <div class="field">
          <label for="name">品名</label>
          <input id="name" type="text" placeholder="例：豚バラ肉" autocomplete="off">
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="category">カテゴリー</label>
            <select id="category"></select>
          </div>
          <div class="field">
            <label for="amount">量</label>
            <input id="amount" type="text" placeholder="例：300g" autocomplete="off">
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="expiry">期限</label>
            <input id="expiry" type="date">
          </div>
          <div class="field">
            <label for="store">購入店</label>
            <div class="select-add">
              <select id="store"></select>
              <button id="addStoreBtn" class="add-btn" type="button" aria-label="購入店を追加">＋</button>
            </div>
          </div>
        </div>

        <div class="field mt6">
          <label for="memo">メモ</label>
          <input id="memo" type="text" placeholder="任意" autocomplete="off">
        </div>

        <button id="submitBtn" class="submit-btn" type="button">入力</button>
      </section>

      <button id="openInventoryBtn" class="inventory-open-btn" type="button">
        在庫一覧を見る <span id="inventoryCountMain">0件</span>
      </button>

      <section class="card output-card">
        <div class="section-title">こんだて相談</div>
        <div class="output-actions">
          <button id="consultBtn" class="primary-btn" type="button">相談文を作る</button>
          <button id="copyConsultBtn" class="copy-btn" type="button">コピー</button>
          <button id="shareConsultBtn" class="copy-btn" type="button">共有</button>
        </div>
        <textarea id="consultText" class="output-text" readonly></textarea>
      </section>

      <section class="card output-card">
        <div class="section-title">買い物リスト</div>
        <div class="output-actions">
          <button id="shoppingListBtn" class="primary-btn shopping-btn" type="button">リストを作る</button>
          <button id="copyShoppingBtn" class="copy-btn" type="button">コピー</button>
        </div>
        <textarea id="shoppingText" class="output-text" readonly></textarea>
      </section>
    </section>

    <section id="inventoryView" class="view">
      <header class="inventory-header">
        <button id="backBtn" class="back-btn" type="button">← 戻る</button>
        <div class="inventory-title">在庫一覧</div>
        <div></div>
      </header>

      <section class="card inventory-card">
        <div class="inventory-meta">
          <strong>登録中の食材</strong>
          <span id="inventoryCount" class="inventory-count">0件</span>
        </div>
        <div id="categoryFilters" class="category-filters"></div>
        <div id="inventoryList" class="inventory-list"></div>
      </section>
    </section>
  </main>

  <div id="detailModal" class="modal">
    <div class="modal-sheet">
      <h2 id="detailName" class="modal-title"></h2>
      <div class="detail-grid">
        <div class="detail-label">カテゴリー</div><div id="detailCategory"></div>
        <div class="detail-label">量</div><div id="detailAmount"></div>
        <div class="detail-label">期限</div><div id="detailExpiry"></div>
        <div class="detail-label">購入店</div><div id="detailStore"></div>
        <div class="detail-label">メモ</div><div id="detailMemo"></div>
      </div>
      <div class="modal-buttons">
        <button id="detailEditBtn" class="modal-btn edit-btn" type="button">編集</button>
        <button id="closeDetailBtn" class="modal-btn close-btn" type="button">閉じる</button>
      </div>
    </div>
  </div>

  <div id="editModal" class="modal">
    <div class="modal-sheet">
      <h2 class="modal-title">食材を編集</h2>
      <div class="edit-form">
        <div class="field"><label for="editName">品名</label><input id="editName" type="text"></div>
        <div class="grid-2">
          <div class="field"><label for="editCategory">カテゴリー</label><select id="editCategory"></select></div>
          <div class="field"><label for="editAmount">量</label><input id="editAmount" type="text"></div>
        </div>
        <div class="grid-2">
          <div class="field"><label for="editExpiry">期限</label><input id="editExpiry" type="date"></div>
          <div class="field"><label for="editStore">購入店</label><select id="editStore"></select></div>
        </div>
        <div class="field"><label for="editMemo">メモ</label><input id="editMemo" type="text"></div>
      </div>
      <div class="modal-buttons">
        <button id="cancelEditBtn" class="modal-btn close-btn" type="button">キャンセル</button>
        <button id="saveEditBtn" class="modal-btn save-btn" type="button">保存</button>
      </div>
    </div>
  </div>

  <div id="storeModal" class="modal">
    <div class="modal-sheet">
      <h2 class="modal-title">購入店を追加</h2>
      <div class="field">
        <label for="storeInput">購入店名</label>
        <input id="storeInput" type="text" placeholder="例：イオン" autocomplete="off">
      </div>
      <div class="modal-buttons">
        <button id="cancelStoreBtn" class="modal-btn close-btn" type="button">キャンセル</button>
        <button id="saveStoreBtn" class="modal-btn save-btn" type="button">追加</button>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal">
    <div class="modal-sheet">
      <h2 class="modal-title">データ管理</h2>
      <div class="settings-list">
        <button id="importCsvBtn" class="settings-action" type="button">Google Sheets用CSVをインポート<span>既存の在庫リストを読み込み</span></button>
        <button id="exportJsonBtn" class="settings-action" type="button">JSONバックアップを書き出す<span>スマホ内データを保存</span></button>
        <button id="restoreJsonBtn" class="settings-action" type="button">JSONから復元<span>バックアップファイルを読み込み</span></button>
        <button id="checkUpdateBtn" class="settings-action" type="button">更新を確認<span id="updateStatus">現在のバージョンを確認</span></button>
        <button id="clearDataBtn" class="settings-action danger" type="button">全データ削除<span>この端末のデータを初期化</span></button>
      </div>
      <div class="settings-info">
        <div>アプリ: <strong id="settingsAppVersion"></strong></div>
        <div>DB: <strong id="settingsDbVersion"></strong></div>
        <div>最終バックアップ: <strong id="lastBackupLabel">未実施</strong></div>
      </div>
      <button id="closeSettingsBtn" class="wide-close" type="button">閉じる</button>
    </div>
  </div>

  <div id="importModal" class="modal">
    <div class="modal-sheet">
      <h2 class="modal-title">CSVインポート</h2>
      <div id="importSummary" class="import-summary"></div>
      <div class="radio-group">
        <label><input type="radio" name="importMode" value="merge" checked> 追加・更新</label>
        <label><input type="radio" name="importMode" value="replace"> 全置換</label>
      </div>
      <div class="modal-buttons">
        <button id="cancelImportBtn" class="modal-btn close-btn" type="button">キャンセル</button>
        <button id="confirmImportBtn" class="modal-btn save-btn" type="button">インポート</button>
      </div>
    </div>
  </div>

  <div id="updateBanner" class="update-banner" hidden>
    <span>新しいバージョンがあります</span>
    <button id="applyUpdateBtn" type="button">更新</button>
  </div>

  <input id="csvFileInput" type="file" accept=".csv,text/csv" hidden>
  <input id="jsonFileInput" type="file" accept=".json,application/json" hidden>
  <div id="toast" class="toast"></div>
  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/share.js"></script>
</body>
</html>
